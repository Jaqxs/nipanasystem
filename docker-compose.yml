version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - FRONTEND_URL=https://system.nipanaatlas.co.tz
    restart: always

  frontend:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=https://backend.nipanaatlas.co.tz/api
    ports:
      - "3000:3000"
    restart: always
